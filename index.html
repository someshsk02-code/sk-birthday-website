<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> advance Happy birthday my love </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff6b6b,#ffb347,#6a11cb);
    overflow:hidden;
    font-family:'Poppins',sans-serif;
}

.container{
    text-align:center;
    color:white;
    z-index:2;
}

h1{
    font-size:4rem;
    animation:glow 2s infinite alternate;
}

h2{
    margin-top:15px;
    font-size:2rem;
    animation:fadeIn 3s ease-in-out infinite;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px #fff,
                    0 0 20px #ff00ff,
                    0 0 30px #ff00ff;
    }
    to{
        text-shadow:0 0 20px #fff,
                    0 0 40px #00ffff,
                    0 0 60px #00ffff;
    }
}

@keyframes fadeIn{
    0%,100%{opacity:0.5;}
    50%{opacity:1;}
}

/* Balloons */
.balloon{
    position:absolute;
    bottom:-150px;
    width:80px;
    height:100px;
    border-radius:50%;
    animation:float 10s linear infinite;
}

.balloon::after{
    content:"";
    position:absolute;
    width:2px;
    height:80px;
    background:white;
    left:50%;
    top:100%;
}

.b1{left:10%; background:red; animation-duration:8s;}
.b2{left:30%; background:yellow; animation-duration:12s;}
.b3{left:50%; background:lime; animation-duration:10s;}
.b4{left:70%; background:cyan; animation-duration:9s;}
.b5{left:90%; background:pink; animation-duration:11s;}

@keyframes float{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
    }
}

/* Confetti */
.confetti{
    position:absolute;
    width:10px;
    height:10px;
    background:white;
    animation:fall 5s linear infinite;
}

@keyframes fall{
    from{
        transform:translateY(-100vh) rotate(0deg);
    }
    to{
        transform:translateY(100vh) rotate(720deg);
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>🎂 advance Happy Birthday my love! 🎉</h1>
    <h2>Wishing You Joy, Success & Happiness!</h2>
</div>

<div class="balloon b1"></div>
<div class="balloon b2"></div>
<div class="balloon b3"></div>
<div class="balloon b4"></div>
<div class="balloon b5"></div>

<script>
// Create Confetti
for(let i=0;i<80;i++){
    let confetti=document.createElement("div");
    confetti.classList.add("confetti");

    confetti.style.left=Math.random()*100+"vw";
    confetti.style.backgroundColor=
        `hsl(${Math.random()*360},100%,50%)`;

    confetti.style.animationDuration=
        (Math.random()*3+2)+"s";

    document.body.appendChild(confetti);
}
</script>

</body>
</html>
